[package]
name = "clack-desktop"
description = "Desktop application for Clack"
version = "0.2.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/fnune/clack"

[lib]
name = "clack_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clack-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cairo-rs = "0.21"
clack = { path = "../../../crates/clack", version = "0.2.2" }
gtk = "0.18"
libappindicator = "0.9"
png = "0.17"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
thiserror = "2"
toml = "0.9"
zbus = "5"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
