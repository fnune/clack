[package]
name = "clack-tray"
description = "Tray application for Clack"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fnune/clack"

[lib]
name = "clack_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clack-tray"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clack = { path = "../../../crates/clack", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"
toml = "0.9"
zbus = "5"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
