[workspace]
resolver = "3"
members = ["crates/clack", "crates/clack-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fnune/clack"

[workspace.dependencies]
clack-core = { path = "crates/clack-core", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
as_conversions = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
strip = true
