name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@395771a1db7789d50e1070d49e746465de179042
        with:
          cache-paths: |
            .cargo/registry
            .cargo/git
            ./target
          cache-key-files: Cargo.lock
          command: |
            cargo fmt --check
            cargo clippy --all-targets -- -D warnings
            cargo test
            cargo deny check
            ./scripts/e2e.sh
            nix build

  desktop:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@395771a1db7789d50e1070d49e746465de179042
        with:
          working-directory: apps/desktop
          cache-paths: |
            .cargo/registry
            .cargo/git
            .local/share/pnpm/store
            ./src-tauri/target
          cache-key-files: apps/desktop/pnpm-lock.yaml
          command: |
            cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
            pnpm install --frozen-lockfile
            pnpm check
            pnpm typecheck
            pnpm build

  published:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the released AppImage is the one the flake pins
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          url="https://github.com/${{ github.repository }}/releases/download/v$version/Clack-x86_64.AppImage"

          if ! curl -fsSLI "$url" >/dev/null; then
            echo "v$version has no AppImage published yet, so there is nothing to check."
            exit 0
          fi

          curl -fsSL -o published.AppImage "$url"
          committed=$(cat packaging/appimage.sha256)
          published=$(sha256sum published.AppImage | cut -d' ' -f1)

          if [[ $committed != "$published" ]]; then
            echo "The published AppImage is not the one Nix would be told to fetch."
            echo "  committed: $committed"
            echo "  published: $published"
            exit 1
          fi

  artifacts:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: ./scripts/build-release.sh
      - run: sha256sum dist/clack-linux-amd64 dist/Clack-x86_64.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appdir-manifest
          path: dist/appdir-manifest.txt
