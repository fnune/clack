name: Release

on:
  push:
    tags: ["v*"]

env:
  GIT_CLIFF_VERSION: "2.13.1"
  GIT_CLIFF_SHA256: "9a1263f24e59a2f508c7b3d3283c9dea94a8bf697f96dbc18cc783cac6284546"

jobs:
  wait-for-ci:
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Wait for CI to pass
        run: |
          for _ in $(seq 60); do
            status=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
              --jq '.check_runs
                    | map(select(.name == "check" or .name == "desktop"))
                    | if length < 2 then "pending"
                      elif any(.conclusion == "failure" or .conclusion == "cancelled") then "failure"
                      elif all(.conclusion == "success") then "success"
                      else "pending" end')
            echo "CI: $status"
            case "$status" in
              success) exit 0 ;;
              failure) exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for CI"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - run: ./scripts/build-release.sh

      - name: Write the release notes
        run: |
          curl -fsSL -o git-cliff.tar.gz \
            "https://github.com/orhun/git-cliff/releases/download/v$GIT_CLIFF_VERSION/git-cliff-$GIT_CLIFF_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$GIT_CLIFF_SHA256  git-cliff.tar.gz" | sha256sum --check --quiet
          tar xzf git-cliff.tar.gz --strip-components=1 "git-cliff-$GIT_CLIFF_VERSION/git-cliff"
          ./git-cliff --latest --strip header > release-notes.md
          cat release-notes.md

      - name: Draft the release
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            dist/clack-linux-amd64 \
            dist/Clack-x86_64.AppImage \
            dist/checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
